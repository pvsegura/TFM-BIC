# SonarQube analysis configuration for TFM-BIC.
# sonar.host.url and the auth token are NOT set here — Jenkins' withSonarQubeEnv step injects
# them from the Jenkins-configured SonarQube server connection (see Jenkinsfile). Never put a
# token in this file.

sonar.projectKey=tfm-bic
sonar.projectName=TFM-BIC
sonar.sourceEncoding=UTF-8

# apps/packages contain both production code and colocated *.test.ts(x) files; tests/ (e2e,
# integration) is physically separate. Overlapping sonar.sources/sonar.tests plus
# sonar.test.inclusions is the standard way SonarQube's JS/TS analyzer tells the two apart
# without a build step splitting them.
sonar.sources=apps,packages
sonar.tests=apps,packages,tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,tests/e2e/**/*.spec.ts

# Generated/build output and vendor code — never analyzed at all (not just excluded from
# coverage). Does not exclude any meaningful production source.
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.d.ts,**/coverage/**,**/playwright-report/**,**/test-results/**

# Mirrors vitest.config.ts's own coverage.exclude list: config/bootstrap files with no
# branching logic of their own, plus test files themselves (coverage doesn't apply to tests).
sonar.coverage.exclusions=**/*.config.{ts,js,mjs},**/*.test.{ts,tsx},tests/**,apps/web/src/main.tsx,apps/web/src/app.tsx,apps/web/src/router.tsx,apps/api/src/index.ts

# Produced by `pnpm test:coverage` (vitest.config.ts: coverage.reporter includes "lcov").
sonar.javascript.lcov.reportPaths=coverage/lcov.info
